<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mock 11 — Olive wash</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#372c24; --muted:#867b6b; --cream:#f7f0df; --parchment:#fbf6e8; --sand:#e7d7b0; --card:#fffaf0; --olive:#6f8f4e; --olive-dark:#2d4a22; --olive-deep:#213a18; --moss:#8fa367; --line:#ded1b2; }
      * { box-sizing:border-box; }
      body { align-items:center; background:#12100e; display:flex; flex-direction:column; gap:20px; margin:0; min-height:100vh; padding:32px 16px 48px; }
      .back { align-self:flex-start; color:#8fa367; font-family:'Instrument Sans',sans-serif; font-size:14px; margin-left:max(0px,calc(50% - 195px)); text-decoration:none; }
      .caption { color:#b8a88a; font-family:'Source Serif 4',Georgia,serif; font-size:15px; line-height:1.55; margin:0; max-width:390px; text-align:center; }
      .phone { background:var(--cream); border:3px solid #3d342c; border-radius:44px; box-shadow:0 32px 80px rgba(0,0,0,.55); height:780px; overflow:hidden; position:relative; width:390px; }
      .scroll { display:flex; flex-direction:column; gap:16px; height:100%; overflow:hidden; padding:54px 20px 90px; }
      .header h1 { color:var(--ink); font-family:'Source Serif 4',Georgia,serif; font-size:32px; margin:0; }
      .header p { color:var(--muted); font-size:15px; margin:4px 0 8px; }
      .section { color:var(--muted); font-family:'Instrument Sans',sans-serif; font-size:11px; font-weight:700; letter-spacing:1px; margin:8px 0 0; text-transform:uppercase; }
      .surprise { background:var(--olive-deep); border-radius:16px; height:88px; }
      .ghost { background:var(--parchment); border:1px solid var(--line); border-radius:12px; height:72px; opacity:.55; }
      .wash-card {
        background: linear-gradient(135deg, rgba(143,163,103,.22) 0%, rgba(251,246,232,.95) 55%, var(--parchment) 100%);
        border: 1px solid rgba(111,143,78,.35);
        border-radius: 16px;
        box-shadow: 0 4px 16px rgba(33,58,24,.08);
        margin-top: auto;
        overflow: hidden;
      }
      .list-row { align-items:center; background:transparent; border:none; display:flex; gap:14px; padding:20px 18px; width:100%; }
      .list-row .glyph {
        align-items:center;
        background:var(--olive);
        border-radius:50%;
        box-shadow:0 2px 8px rgba(33,58,24,.2);
        color:var(--card);
        display:flex;
        flex-shrink:0;
        height:48px;
        justify-content:center;
        width:48px;
      }
      .list-row .glyph svg { height:22px; width:22px; stroke:currentColor; fill:none; stroke-width:2.4; stroke-linecap:round; }
      .list-row .copy { flex:1; min-width:0; text-align:left; }
      .list-row h3 { color:var(--olive-dark); font-family:'Instrument Sans',sans-serif; font-size:17px; font-weight:700; margin:0 0 4px; }
      .list-row p { color:var(--muted); font-size:12px; line-height:1.45; margin:0; max-width:220px; }
      .list-row .chev {
        align-items:center;
        background:rgba(255,250,240,.7);
        border:1px solid rgba(111,143,78,.25);
        border-radius:50%;
        color:var(--olive-dark);
        display:flex;
        flex-shrink:0;
        font-size:18px;
        height:32px;
        justify-content:center;
        width:32px;
      }
      .highlight { outline:3px solid #c4e088; outline-offset:3px; }
      .tabbar { background:rgba(251,246,232,.95); border-top:1px solid var(--line); bottom:0; display:flex; height:72px; justify-content:space-around; left:0; padding-top:10px; position:absolute; right:0; }
      .tab { background:var(--line); border-radius:4px; height:8px; width:48px; }
      .tab.on { background:var(--olive); }
    </style>
  </head>
  <body>
    <a class="back" href="index.html">← All mocks</a>
    <p class="caption"><strong>Mock 11 — Olive wash.</strong> Warm moss gradient card, solid olive icon disc, circular chevron — inviting upgrade of Mock 6 without the Start pill clash.</p>
    <div class="phone">
      <div class="scroll">
        <div class="header"><h1>Goals</h1><p>Plans to stay consistent with dhikr.</p></div>
        <div class="surprise"></div>
        <div class="section">Suggested</div>
        <div class="ghost"></div>
        <div class="wash-card highlight">
          <button type="button" class="list-row">
            <span class="glyph"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
            <div class="copy">
              <h3>Plan a new goal</h3>
              <p>Set your duration, pick duas, and define daily counts</p>
            </div>
            <span class="chev">›</span>
          </button>
        </div>
      </div>
      <div class="tabbar"><span class="tab"></span><span class="tab"></span><span class="tab on"></span><span class="tab"></span><span class="tab"></span></div>
    </div>
  </body>
</html>
