<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Fine individual grains -->
    <filter id="fine" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="2.8" numOctaves="4" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.72
                0 0 0 0 0.62
                0 0 0 0 0.42
                0 0 0 0.55 0"/>
    </filter>
    <!-- Coarser speckle clusters -->
    <filter id="speckle" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.85" numOctaves="2" seed="53" result="specks"/>
      <feColorMatrix in="specks" type="matrix"
        values="0 0 0 0 0.58
                0 0 0 0 0.48
                0 0 0 0 0.32
                0 0 0 0.35 0"/>
    </filter>
    <!-- Subtle wind ripples in the sand -->
    <filter id="ripple" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06 0.18" numOctaves="2" seed="9" result="waves"/>
      <feColorMatrix in="waves" type="matrix"
        values="0 0 0 0 0.65
                0 0 0 0 0.55
                0 0 0 0 0.38
                0 0 0 0.08 0"/>
    </filter>
    <linearGradient id="base" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#f2e6c8"/>
      <stop offset="38%" stop-color="#e8d9b0"/>
      <stop offset="72%" stop-color="#dcc898"/>
      <stop offset="100%" stop-color="#d0bc88"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#base)"/>
  <rect width="512" height="512" filter="url(#ripple)"/>
  <rect width="512" height="512" filter="url(#speckle)" opacity="0.45"/>
  <rect width="512" height="512" filter="url(#fine)" opacity="0.82"/>
</svg>
