<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mock 6 — Ghost pill</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#372c24; --muted:#867b6b; --cream:#f7f0df; --parchment:#fbf6e8; --card:#fffaf0; --olive:#6f8f4e; --olive-dark:#2d4a22; --line:#ded1b2; }
      * { box-sizing:border-box; }
      body { align-items:center; background:#12100e; display:flex; flex-direction:column; gap:20px; margin:0; min-height:100vh; padding:32px 16px 48px; }
      .back { align-self:flex-start; color:#8fa367; font-family:'Instrument Sans',sans-serif; font-size:14px; margin-left:max(0px,calc(50% - 195px)); text-decoration:none; }
      .caption { color:#b8a88a; font-family:'Source Serif 4',Georgia,serif; font-size:15px; line-height:1.55; margin:0; max-width:390px; text-align:center; }
      .phone { background:var(--cream); border:3px solid #3d342c; border-radius:44px; box-shadow:0 32px 80px rgba(0,0,0,.55); height:780px; overflow:hidden; width:390px; }
      .scroll { display:flex; flex-direction:column; gap:18px; padding:54px 20px 40px; }
      .header { align-items:flex-start; display:flex; gap:12px; justify-content:space-between; }
      .header h1 { color:var(--ink); font-family:'Source Serif 4',Georgia,serif; font-size:32px; margin:0; }
      .header p { color:var(--muted); font-size:15px; margin:4px 0 0; }
      .ghost-pill { align-items:center; background:var(--parchment); border:1.5px solid var(--line); border-radius:999px; color:var(--olive-dark); display:inline-flex; flex-shrink:0; font-family:'Instrument Sans',sans-serif; font-size:14px; font-weight:700; gap:4px; margin-top:6px; padding:9px 14px 9px 11px; }
      .highlight { outline:3px solid #c4e088; outline-offset:4px; }
      .card { background:var(--parchment); border:1px solid var(--line); border-radius:14px; padding:20px; }
      .card .section { color:var(--muted); font-family:'Instrument Sans',sans-serif; font-size:11px; font-weight:700; letter-spacing:1px; margin-bottom:12px; text-transform:uppercase; }
      .dial { background:var(--line); border-radius:999px; height:80px; margin:8px auto; width:75%; }
    </style>
  </head>
  <body>
    <a class="back" href="index.html">← All mocks</a>
    <p class="caption"><strong>Mock 6 — Ghost pill.</strong> Same compact placement as today, but parchment fill + line border — no heavy olive slab competing with the dial card.</p>
    <div class="phone"><div class="scroll">
      <div class="header">
        <div><h1>Settings</h1><p>Tap weight, theme, and language.</p></div>
        <button type="button" class="ghost-pill highlight"><span>‹</span> Done</button>
      </div>
      <div class="card"><div class="section">Count per tap</div><div class="dial"></div></div>
    </div></div>
  </body>
</html>
