<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="5" seed="31" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.88
                0 0 0 0 0.78
                0 0 0 0 0.55
                0 0 0 0.45 0"/>
    </filter>
    <filter id="dune" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.12" numOctaves="3" seed="8" result="waves"/>
      <feColorMatrix in="waves" type="matrix"
        values="0 0 0 0 0.82
                0 0 0 0 0.70
                0 0 0 0 0.48
                0 0 0 0.12 0"/>
    </filter>
    <linearGradient id="base" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#e8d4a8"/>
      <stop offset="45%" stop-color="#dcc898"/>
      <stop offset="100%" stop-color="#c9a86a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#base)"/>
  <rect width="512" height="512" filter="url(#dune)"/>
  <rect width="512" height="512" filter="url(#grain)" opacity="0.7"/>
</svg>
