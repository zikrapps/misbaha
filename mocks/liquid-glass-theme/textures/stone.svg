<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="12" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.42
                0 0 0 0 0.40
                0 0 0 0 0.38
                0 0 0 0.55 0"/>
    </filter>
    <filter id="vein" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.02 0.08" numOctaves="2" seed="5" result="veins"/>
      <feColorMatrix in="veins" type="matrix"
        values="0 0 0 0 0.32
                0 0 0 0 0.30
                0 0 0 0 0.28
                0 0 0 0.18 0"/>
    </filter>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a9690"/>
      <stop offset="35%" stop-color="#b8b4ac"/>
      <stop offset="65%" stop-color="#8a8680"/>
      <stop offset="100%" stop-color="#a8a49c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#base)"/>
  <rect width="512" height="512" filter="url(#vein)"/>
  <rect width="512" height="512" filter="url(#grain)" opacity="0.65"/>
</svg>
